name: Release Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: myelinc.exe
            asset_name: myelinc-windows-x86_64.zip
            use_zip: true

          # Linux x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: myelinc
            asset_name: myelinc-linux-x86_64.tar.gz
            use_zip: false

          # Linux ARM64 (AArch64)
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            binary_name: myelinc
            asset_name: myelinc-linux-arm64.tar.gz
            use_zip: false
            use_cross: true

          # macOS Apple Silicon (M1/M2/M3/M4)
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: myelinc
            asset_name: myelinc-macos-arm64.tar.gz
            use_zip: false

          # macOS Intel
          - os: macos-13
            target: x86_64-apple-darwin
            binary_name: myelinc
            asset_name: myelinc-macos-x86_64.tar.gz
            use_zip: false

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Cross (for cross-compilation if needed)
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build Binary (Release)
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release -p myelinc --target ${{ matrix.target }}
          else
            cargo build --release -p myelinc --target ${{ matrix.target }}
          fi
        shell: bash

      - name: Package Windows Binary (.zip)
        if: matrix.use_zip
        run: |
          7z a ${{ matrix.asset_name }} ./target/${{ matrix.target }}/release/${{ matrix.binary_name }} ./README.md ./LICENSE
        shell: bash

      - name: Package Unix Binary (.tar.gz)
        if: "!matrix.use_zip"
        run: |
          tar -czvf ${{ matrix.asset_name }} -C ./target/${{ matrix.target }}/release/ ${{ matrix.binary_name }} -C ../../../ README.md LICENSE
        shell: bash

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.asset_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
